name: personal-apk

# A sideloadable APK for this fork, built on demand (Actions tab → personal-apk
# → Run workflow). The upload to your own server is compiled in but off until
# you set Settings › Privacy › Upload server and turn on the upload. No server
# address is baked in, so the APK holds no secret and the artifact is safe to
# download anywhere.
#
# SIGNING. Android only installs an update signed with the same key as the
# installed app, so every build must use one fixed key. A runner's debug key
# is new on every run, which would force an uninstall (and data loss) on each
# update, so this refuses to build without the four secrets below.
#   ANDROID_KEYSTORE_BASE64   base64 of the keystore file (PKCS12 or JKS)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

# UPDATES. Every push to main also publishes a GitHub Release holding the
# APK, so an updater on the phone (Obtainium) can find and install it without
# a GitHub login. The fork is public, so the release is public too; the APK
# carries no server address or secret, only code that is already public.
# The build number is 100000 + the run number, so it always rises and stays
# above upstream's own numbers; Android and updaters compare on it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-apk
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing signing secret ($v). See the header of this workflow."
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - run: flutter pub get

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --build-number=$((100000 + GITHUB_RUN_NUMBER))
          --dart-define=ENABLE_HEALTH_DATA_CONTRIBUTION=true

      - name: Name the APK after the commit
        id: rename
        run: |
          mkdir -p dist
          apk="dist/whalternative-$(git rev-parse --short HEAD).apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: whalternative-apk
          path: ${{ steps.rename.outputs.apk }}
          retention-days: 30

      - name: Publish a release for updaters
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.rename.outputs.apk }}
        run: |
          build=$((100000 + GITHUB_RUN_NUMBER))
          tag="build-$build"
          gh release create "$tag" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Whalternative build $build ($(git rev-parse --short HEAD))" \
            --notes "$(git log -1 --format=%s)" \
            --latest

      - name: Keep only the 10 newest releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:] | .[] | .tagName' \
          | grep '^build-' \
          | while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
